name: 'retail_analytics'
version: '1.0.0'
config-version: 2

profile: 'retail_analytics'

model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

clean-targets:
  - "target"
  - "dbt_packages"

# Fixed calendar span for dim_date, so it always covers the facts.
# Olist orders run 2016-2018.
vars:
  date_spine_start: '2016-01-01'
  date_spine_end: '2019-12-31'

models:
  retail_analytics:
    +on_schema_change: append_new_columns

    staging:
      +materialized: view
      +schema: staging
      +tags: ['staging']

    intermediate:
      +materialized: ephemeral
      +schema: intermediate
      +tags: ['intermediate']

    marts:
      core:
        +materialized: table
        +schema: core
        +tags: ['core']
      analytics:
        +materialized: table
        +schema: analytics
        +tags: ['analytics', 'bi']

# Keep failing rows so you can inspect them in the warehouse
tests:
  retail_analytics:
    +store_failures: true
    +schema: dbt_test_failures